schema = 1
id = "agent-harness"
name = "Agent Harness"
version = "0.1.3"
api_version = "1"
description = "A configurable workspace for coding-agent harnesses such as OpenCode, Claude Code, Codex, and Gemini."
entry = "ui/index.html"
overview = "ui/overview.html"
settings = "ui/settings.html"
overview_default = true
page_default = true
icon = "ui/icon.svg"
node_scope = "node"
permissions = ["backend", "storage", "app.open", "fs.pick"]

[ui]
surface = "page"
overview_width = 2
overview_height = 4

[backend]
kind = "sidecar"
command = ["python3", "backend/server.py"]
health_path = "/health"
ready_timeout_ms = 15000
python = ">=3.9"
sandbox = false

[[config.fields]]
key = "default_harness"
type = "text"
label = "Default agent (legacy)"
default = "opencode"
help = "Seeds the agent registry on first install. Manage the default for new conversations in Settings → Agents."

[[config.fields]]
key = "show_overview_button"
type = "boolean"
label = "Show open button in overview"
default = true

[[config.fields]]
key = "allow_adapter_install"
type = "boolean"
label = "Allow adapter fallback (npx)"
default = false
help = "When a harness adapter is not on PATH, run its documented npx fallback. Requires Node and network access."

[[config.fields]]
key = "max_concurrent_sessions"
type = "number"
label = "Concurrent sessions"
default = 4
min = 1
max = 12
step = 1

[[config.fields]]
key = "transcript_retention_days"
type = "number"
label = "Transcript retention (days)"
default = 30
min = 0
max = 365
step = 1
help = "0 keeps transcripts until you delete them."

[[config.fields]]
key = "orqella_mcp"
type = "boolean"
label = "Give sessions Orqella tools"
default = true
help = "Adds the local Orqella MCP gateway to every ACP session. The agent can inspect the dashboard, modules, logs, and builds."

[[config.fields]]
key = "orqella_mcp_profile"
type = "select"
label = "Orqella MCP profile"
default = "read"
help = "Read-only is the safe default. Dev also exposes module install/control/configure and build tools."
options = [
  { value = "read", label = "Read-only" },
  { value = "dev", label = "Dev (module tools)" },
]
