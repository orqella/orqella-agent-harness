<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent Harness overview</title>
  <link rel="stylesheet" href="/assets/theme.css">
  <link rel="stylesheet" href="/assets/module.css">
  <link rel="stylesheet" href="overview.css">
</head>
<body>
  <main class="ov">
    <header>
      <div class="ov-heading">
        <p class="eyebrow">Agent workspace</p>
        <h1>Agent Harness</h1>
        <select class="ov-harness" id="harness" aria-label="Harness"></select>
      </div>
      <div class="head-actions">
        <span class="state" id="state">checking</span>
        <button class="icon" id="native" type="button" title="Open native workspace" aria-label="Open native workspace">⌂</button>
        <button class="icon" id="open" type="button" title="Open workspace" aria-label="Open workspace">↗</button>
      </div>
    </header>
    <form id="launch">
      <textarea id="prompt" rows="2" placeholder="What should the agent work on?" aria-label="Prompt"></textarea>
      <div class="cwd-row">
        <span class="cwd mono" id="cwdValue" dir="ltr" title="Workspace folder">—</span>
        <button type="button" class="link" id="chooseCwd">change</button>
      </div>
      <div class="controls">
        <button class="start" id="start" type="submit" disabled>Start session</button>
      </div>
    </form>
    <div class="sessions">
      <button class="sessions-toggle" id="sessionsToggle" type="button" aria-expanded="false"><span>Recent sessions</span><span id="sessionsChevron">▾</span></button>
      <div class="session-menu" id="sessionMenu" hidden>
        <div class="session-list" id="sessionList"></div>
        <div class="session-more" id="sessionMore">Scroll for earlier sessions</div>
      </div>
    </div>
    <p class="feedback" id="feedback"></p>
  </main>
  <script src="vendor/markdown.js"></script>
  <script src="common.js"></script>
  <script src="overview.js"></script>
</body>
</html>
